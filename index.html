<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="选择图片或拍照，提取图片中的文字与表格。" />
  <title>图片文字提取</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◫</span>
      <div>
        <h1>图片文字提取</h1>
        <p class="sub">选择图片或拍照，提取文字与表格</p>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="lang-field">
        <span>识别语言</span>
        <select id="langSelect"></select>
      </label>
      <button id="cloudBadge" class="badge" type="button">本地识别</button>
      <button id="historyBtn" class="ghost" type="button">历史</button>
      <button id="settingsBtn" class="ghost" type="button">设置</button>
    </div>
  </header>

  <main class="layout">
    <section class="pane">
      <div id="dropzone" class="dropzone">
        <div class="dz-inner">
          <div class="dz-icon" aria-hidden="true">↑</div>
          <p class="dz-title">把图片拖到这里</p>
          <p class="dz-hint">支持 JPG / PNG / WebP / BMP，可一次选多张</p>
          <div class="dz-actions">
            <button id="pickBtn" class="primary" type="button">选择图片</button>
            <button id="cameraBtn" class="secondary" type="button">拍照</button>
          </div>
        </div>
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
        <input id="captureInput" type="file" accept="image/*" capture="environment" hidden />
      </div>

      <div class="pane-head">
        <h2>识别队列 <span id="queueCount" class="count">0</span></h2>
        <button id="clearQueueBtn" class="link" type="button">清空</button>
      </div>
      <p id="queueEmpty" class="empty">还没有图片，选一张开始吧。</p>
      <ul id="queueList" class="queue"></ul>
    </section>

    <section class="pane result-pane">
      <div class="pane-head">
        <h2>识别结果</h2>
        <span id="resultMode" class="mode"></span>
      </div>
      <div id="resultBody" class="result-body">
        <p class="empty">识别结果会显示在这里。</p>
      </div>
      <div class="result-tools">
        <button id="copyBtn" class="secondary" type="button" disabled>复制</button>
        <button id="downloadMdBtn" class="secondary" type="button" disabled>下载 .md</button>
        <button id="downloadTxtBtn" class="secondary" type="button" disabled>下载 .txt</button>
        <button id="downloadCsvBtn" class="secondary" type="button" disabled>表格 .csv</button>
      </div>
    </section>
  </main>

  <dialog id="settingsDialog" class="dialog">
    <form id="settingsForm" class="dialog-form">
      <header class="dialog-head">
        <h2>识别设置</h2>
        <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
      </header>
      <div class="dialog-body">
        <label class="switch-row">
          <span>
            <strong>启用云端增强</strong>
            <small>用视觉大模型识别，表格结构更准确</small>
          </span>
          <input id="cloudEnabled" type="checkbox" />
        </label>
        <div class="field">
          <label for="baseUrl">接口地址（Base URL）</label>
          <input id="baseUrl" type="url" placeholder="https://openrouter.ai/api/v1" autocomplete="off" />
        </div>
        <div class="field">
          <label for="apiKey">API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
          <button id="toggleKeyBtn" class="link" type="button">显示</button>
        </div>
        <div class="field">
          <label for="modelInput">模型名称</label>
          <input id="modelInput" type="text" placeholder="例如 google/gemini-2.0-flash-001" autocomplete="off" />
        </div>
        <div class="hint">
          <p>纯静态页面只能直连允许跨域的服务（如 OpenRouter）。其他服务商请把 Base URL 指向你自建的代理。</p>
          <p>Key 仅保存在当前浏览器的 localStorage，不会上传到任何服务器；识别图片会发送到你配置的接口。</p>
        </div>
      </div>
      <footer class="dialog-foot">
        <button class="ghost" type="button" data-close>取消</button>
        <button class="primary" type="submit">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog id="historyDialog" class="dialog wide">
    <div class="dialog-form">
      <header class="dialog-head">
        <h2>识别历史</h2>
        <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
      </header>
      <div id="historyBody" class="dialog-body history-body"></div>
      <footer class="dialog-foot">
        <button id="clearHistoryBtn" class="ghost" type="button">清空历史</button>
        <button class="primary" type="button" data-close>关闭</button>
      </footer>
    </div>
  </dialog>

  <dialog id="cameraDialog" class="dialog camera-dialog">
    <div class="camera-wrap">
      <video id="cameraVideo" playsinline muted autoplay></video>
      <div class="camera-bar">
        <button id="cameraCancel" class="ghost" type="button">取消</button>
        <button id="shutterBtn" class="shutter" type="button" aria-label="拍照"></button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/image.js"></script>
  <script src="js/table.js"></script>
  <script src="js/ocr-local.js"></script>
  <script src="js/ocr-cloud.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
